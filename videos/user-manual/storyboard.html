<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Using Overtime Calculator — storyboard v2</title><style>
:root{--bg:#0A2620;--glass:#16382F;--ink:#ECF7F2;--soft:#C3D9CF;--acc:#10B981;--acc2:#059669;--acc3:#6EE7B7;--amb:#F59E0B;
--disp:Montserrat,'Arial Black',system-ui,sans-serif;--ui:Roboto,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#061a15;color:var(--ink);font-family:var(--ui);padding:40px 32px 80px}
header{display:flex;justify-content:space-between;align-items:end;gap:24px;max-width:1500px;margin:0 auto 28px;border-bottom:2px solid #1f4a3e;padding-bottom:18px}
header h1{font:900 34px/1.1 var(--disp)} header sup{font-size:14px;color:var(--acc3)} header p{color:var(--soft);margin-top:6px;max-width:760px}
.tag{font-style:normal;background:#113a30;color:var(--acc3);padding:8px 14px;border-radius:10px;font-size:13px;white-space:nowrap}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px;max-width:1500px;margin:0 auto}
.cell-wrap{margin:0}
.cell{position:relative;aspect-ratio:9/16;container-type:inline-size;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid #1f4a3e}
.bg{position:absolute;inset:0;background:radial-gradient(60cqw 60cqw at 80% 12%,#10b98138,transparent 70%),radial-gradient(70cqw 70cqw at 10% 90%,#05966922,transparent 70%)}
.bg::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
figcaption{padding:10px 2px 0} .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--acc3);letter-spacing:.02em}
figcaption p{font-size:13px;line-height:1.45;color:var(--soft);margin-top:5px} figcaption b{color:var(--ink)}
.chip{display:inline-block;margin-top:7px;font-style:normal;font-size:11px;background:#113a30;color:var(--acc3);padding:3px 9px;border-radius:99px}
.cap{position:absolute;left:0;right:0;bottom:0;height:17%;display:grid;place-items:center;padding:0 6cqw;background:linear-gradient(transparent,#06191488 30%)}
.cap span{font:700 4.3cqw/1.25 var(--disp);text-align:center;color:#fff;background:#0009;padding:1.6cqw 3cqw;border-radius:2cqw}
.kicker{position:absolute;top:5cqw;left:7cqw;font:900 4.2cqw var(--disp);color:var(--acc3);letter-spacing:.04em;text-transform:uppercase}
.kicker+.kicker{top:10.5cqw;color:var(--ink);font-size:6.4cqw;text-transform:none;letter-spacing:0}
.phone{position:absolute;left:50%;transform:translateX(-50%);width:55cqw;aspect-ratio:9/19;border-radius:7cqw;background:#0c1f1a;border:1.2cqw solid #22473d;box-shadow:0 3cqw 8cqw #0008;overflow:hidden}
.phone.tilt{transform:translateX(-50%) rotate(-4deg)}
.notch{position:absolute;top:1.4cqw;left:50%;transform:translateX(-50%);width:14cqw;height:2.6cqw;border-radius:9cqw;background:#000;z-index:3}
.screen{position:absolute;inset:0;overflow:hidden;font-size:2.5cqw;line-height:1.3}
.tap{position:absolute;width:10cqw;height:10cqw;margin:-5cqw 0 0 -5cqw;border-radius:50%;border:.9cqw solid var(--amb);background:#f59e0b33;z-index:4}
/* portal */
.screen:has(.pbar){background:#f3f4f7;color:#2b2f36}
.pbar{background:#56489a;color:#fff;padding:6cqw 3cqw 2.4cqw;font-weight:700;font-size:2.8cqw}
.pside{position:relative;padding:2cqw 0} .pw{padding:1.5cqw 3cqw;font-weight:700;color:#556}
.pi{padding:1.8cqw 3cqw;font-weight:700} .pi.on{background:#e7e8ee} .ps{padding:1.3cqw 3cqw 1.3cqw 5cqw;color:#667;background:#eceef3}
.hit{outline:.6cqw solid var(--amb);outline-offset:-.6cqw;color:#000;font-weight:700}
.pbody{position:relative;padding:3cqw} .ph{font-size:3.2cqw;margin-bottom:2.5cqw} .pl{font-weight:700;font-size:2.2cqw;margin-top:1.8cqw}
.pf{background:#fff;border:.3cqw solid #cfd3db;padding:1.4cqw;margin-top:.8cqw}
.pcal{display:grid;grid-template-columns:repeat(7,1fr);gap:.4cqw;margin-top:1.5cqw;background:#fff;padding:1cqw;font-size:2cqw;text-align:center}
.pcal .d{background:#2f7ac0;color:#fff;border-radius:.6cqw}
.pbtn{display:inline-block;margin-top:2.5cqw;background:#1daa55;color:#fff;padding:1.5cqw 4cqw;border-radius:.8cqw;font-weight:700}
.pt{padding:1.6cqw;font-size:2.15cqw} .tr{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;padding:1.5cqw .6cqw;border-bottom:.2cqw solid #e2e4ea}
.tr:nth-child(even){background:#eef0f4} .th{font-weight:700;background:#fff!important} .tt{font-weight:700;background:#fff!important}
.pshow{text-align:center;color:#556;margin-top:2cqw}
/* app */
.screen:not(:has(.pbar)){background:linear-gradient(170deg,#12392f,#0b2621);color:var(--ink)}
.ah{padding:7cqw 3.6cqw 2cqw;display:flex;flex-direction:column} .ah b{font-size:4cqw} .ah small{color:var(--soft)}
.res{margin:0 3cqw;border-radius:3.4cqw;background:linear-gradient(160deg,#10b981,#059669);padding:3.4cqw} .res small{font-size:1.8cqw;letter-spacing:.1em}
.res b{display:block;font-size:6cqw;margin-top:.6cqw} .res em{font-style:normal;font-size:2cqw;opacity:.9}
.sal{margin:3cqw;border-radius:3.4cqw;background:#16382fcc;border:.5cqw solid #10b98166;padding:3cqw} .sal.empty{border-color:var(--amb)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin-top:2cqw} .two small{display:block;color:var(--soft);font-size:2cqw}
.two i{display:block;font-style:normal;font-weight:700;font-size:3cqw;background:#0e2b24;border-radius:2cqw;padding:2cqw;margin-top:.8cqw}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.7cqw;padding:2cqw 3cqw;font-size:1.75cqw;text-align:center}
.cal u{text-decoration:none;color:var(--soft)} .cal i{font-style:normal;background:#16382f;border-radius:1.4cqw;padding:.8cqw 0;line-height:1.25;font-weight:700}
.cal .fr{background:#10b98140} .cal .ml{background:#0ea5e950;color:#bae6fd} .cal .sel{outline:.5cqw solid var(--acc3)}
.ed{margin:2cqw 3cqw;border:.4cqw solid #10b98166;border-radius:3cqw;padding:2.6cqw;background:#10b98114;text-align:center}
.ed small{display:block;color:var(--acc3);font-size:2cqw} .tb{display:flex;gap:1.6cqw;margin-top:2cqw;align-items:center} .tb span{width:9cqw;height:9cqw;display:grid;place-items:center;background:#0e2b24;border-radius:2cqw;font-size:4cqw}
.tb i{flex:1;font-style:normal;font-weight:700;font-size:5cqw;background:#0e2b24;border-radius:2cqw;padding:1.4cqw 0}
.sum{display:flex;justify-content:space-between;margin-top:1.8cqw;font-size:1.9cqw;color:var(--soft)} .sum b{color:var(--acc3)}
.chk{margin:4cqw 3cqw;border-radius:3cqw;background:#10b98126;padding:3.2cqw} .chk b{font-size:3.4cqw} .chk p{margin-top:1.6cqw;font-size:2.4cqw;display:flex;justify-content:space-between}
.chk em{font-style:normal;color:var(--acc3);font-weight:900}
.btn{margin:3cqw;border-radius:3cqw;background:linear-gradient(160deg,#10b981,#059669);text-align:center;padding:3.4cqw;font-weight:700;font-size:3cqw}
.btn.hot{outline:.8cqw solid var(--amb)}
.lst{margin:3cqw} .lr{background:#16382f;border-radius:2.4cqw;padding:2.4cqw;margin-bottom:1.8cqw} .lr b{display:block;font-size:2.6cqw} .lr span{color:var(--soft);font-size:2.1cqw}
.lr.warn{border:.4cqw solid #f59e0b88}
.pop{position:absolute;left:3cqw;right:3cqw;bottom:6cqw;background:#1b4439;border-radius:3.4cqw;padding:3cqw;box-shadow:0 2cqw 6cqw #0009} .pop b{font-size:3cqw} .pop p{color:var(--soft);font-size:2.1cqw;margin-top:1cqw}
.pop .two span{text-align:center;padding:1.8cqw;border-radius:2cqw;background:#0e2b24;font-weight:700} .pop .ok{background:#10b981!important}
.thumbs{position:absolute;right:2.5cqw;top:28cqw;display:grid;gap:1.4cqw;z-index:5}
.thumbs i{display:block;width:10cqw;aspect-ratio:9/19;border-radius:2cqw;background:#f3f4f7;border:.6cqw solid #fff;box-shadow:0 1cqw 3cqw #0008;font:900 3.2cqw/1 var(--disp);color:#56489a;display:grid;place-items:center}
.flash{position:absolute;inset:0;background:#fff;opacity:.35;z-index:2}
/* type cells */
.title{position:absolute;left:8cqw;right:8cqw;top:22cqw} .title h1{font:900 11cqw/1.02 var(--disp);letter-spacing:-.02em} .title h1.acc{color:var(--acc3)}
.title p{margin-top:5cqw;font:700 4.4cqw/1.35 var(--disp);color:var(--soft)}
.chap{position:absolute;left:8cqw;right:8cqw;top:38%} .chap em{font:900 30cqw/0.8 var(--disp);color:#10b98155;font-style:normal;display:block}
.chap h1{font:900 9cqw/1.05 var(--disp);margin-top:2cqw} .chap .rule{height:1.4cqw;width:30cqw;background:var(--acc);margin-top:4cqw;border-radius:9cqw}
.side{position:absolute;left:7cqw;right:7cqw;top:24cqw;font:700 3.6cqw/1.3 var(--disp)}
.meta{padding:7cqw;background:#0d2c25} .meta h2{font:900 7cqw var(--disp);margin-bottom:4cqw} .meta p{font-size:3.6cqw;margin-top:4cqw;color:var(--soft)}
.seams{display:flex;flex-wrap:wrap;gap:2cqw} .seams span{font:700 3.4cqw var(--disp);background:#16382f;border-radius:2cqw;padding:1.6cqw 2.2cqw} .seams i{display:block;font:400 2.6cqw var(--ui);color:var(--acc3)}
.sw{font-size:3.4cqw;line-height:2.1} .sw i{display:inline-block;width:5cqw;height:5cqw;border-radius:1.2cqw;vertical-align:middle;margin-right:2cqw;border:.3cqw solid #ffffff33}
.ban{color:#fcd34d!important}
</style></head><body>
<header><div><h1>Using Overtime Calculator <sup>v2</sup></h1><p>Enter your salary once and your hours each day, and the app works out your pay the way your company does.</p></div><em class="tag">1080×1920 · ~2m14s · 19 frames · English voice + captions</em></header>
<main><figure class="cell-wrap"><div class="cell" id="frame-01"><div class="bg"></div><div class="title"><h1 class="">Overtime</h1><h1 class="acc">Calculator</h1><p>Your pay, worked out the way your company does it.</p></div><div class="cap"><span>It works out your pay the way your company does.</span></div></div>
<figcaption><div class="lab"><span>01 · OPEN</span><span>0–5s</span></div><p><b>The name sets first,</b> then the promise builds under it in emerald.</p><em class="chip">cut in</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-02"><div class="bg"></div><div class="chap"><em>1</em><h1>Salary and hours</h1><div class="rule"></div></div></div>
<figcaption><div class="lab"><span>02 · CH 1</span><span>5–7.5s</span></div><p><b>The big numeral fades up,</b> the chapter name slides in from the right, the rule draws.</p><em class="chip">cut</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-03"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>September 2026</b></div><div class="res"><small>EARNED THIS MONTH</small><b>SAR 2,400.00</b><em>No overtime entered yet</em></div><div class="sal"><b>Your salary</b><div class="two"><div><small>Basic pay</small><i>SAR 2,000</i></div><div><small>Food allowance</small><i>SAR 400</i></div></div></div></div></div><div class="cap"><span>Enter your basic pay and food allowance once.</span></div></div>
<figcaption><div class="lab"><span>03 · YOUR SALARY</span><span>7.5–16.5s</span></div><p><b>Digits type into Basic pay,</b> the amber ring turns green, the pay at the top counts up to SAR 2,400.</p><em class="chip">crossfade</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-04"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>This month</b><small>Month worked · September 2026</small></div><div class="ed"><b>Overtime hours</b><div class="tb"><span>−</span><i>11</i><span>+</span></div></div><div class="res"><small>EARNED THIS MONTH</small><b>SAR 2,555.87</b><em>11 overtime hours this month</em></div></div></div><div class="cap"><span>Type your overtime, or step it by half an hour.</span></div></div>
<figcaption><div class="lab"><span>04 · MONTH, OVERTIME</span><span>16.5–25.5s</span></div><p><b>The plus button is tapped twice,</b> the hours step 10 → 10.5 → 11 and the pay above re-counts each time.</p><em class="chip">cut</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-05"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>August 2026</b><small>26 days still to fill in</small></div><div class="cal"><u>S</u><u>M</u><u>T</u><u>W</u><u>T</u><u>F</u><u>S</u><i class="">1<br>·</i><i class="">2<br>·</i><i class="">3<br>·</i><i class="">4<br>·</i><i class="">5<br>·</i><i class="">6<br>·</i><i class="fr">7<br>·</i><i class="">8<br>·</i><i class=" sel">9<br>·</i><i class="">10<br>·</i><i class="">11<br>·</i><i class="">12<br>·</i><i class="">13<br>·</i><i class="fr">14<br>·</i><i class="">15<br>·</i><i class="">16<br>·</i><i class="">17<br>·</i><i class="">18<br>·</i><i class="">19<br>·</i><i class="">20<br>·</i><i class="fr">21<br>·</i><i class="">22<br>·</i><i class="">23<br>·</i><i class="">24<br>·</i><i class="">25<br>·</i><i class="">26<br>·</i><i class="">27<br>·</i><i class="fr">28<br>·</i><i class="">29<br>·</i><i class="">30<br>·</i><i class="">31<br>·</i></div><div class="ed"><b>Sunday 9 August</b><small>Overtime after 9 hrs at work</small><div class="tb"><span>−</span><i>11 : 47</i><span>+</span></div><div class="sum"><span>11:47 − 1:00 lunch − 8:00</span><b>Overtime 2:47</b></div></div></div></div><div class="cap"><span>Enter your time at work, lunch included. Overtime counts after 9 hours.</span></div></div>
<figcaption><div class="lab"><span>05 · DAY BY DAY</span><span>25.5–37.5s</span></div><p><b>A day is tapped,</b> hours then minutes type in, the sum line writes itself, then Next steps to the following day.</p><em class="chip">crossfade</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-06"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>Day types</b></div><div class="lst"><div class="lr"><b>Normal</b><span>Overtime after 9 hrs at work</span></div><div class="lr"><b>Friday</b><span>All overtime after lunch</span></div><div class="lr"><b>Holiday</b><span>All overtime after lunch</span></div><div class="lr warn"><b>Absent</b><span>A day's pay deducted</span></div><div class="lr"><b>Medical leave</b><span>Paid, no overtime</span></div></div></div></div><div class="cap"><span>Friday or holiday: all overtime after lunch. Medical leave is paid.</span></div></div>
<figcaption><div class="lab"><span>06 · WHAT EACH DAY MEANS</span><span>37.5–45.5s</span></div><p><b>Five rows stack in order,</b> each with its one-line meaning.</p><em class="chip">cut</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-07"><div class="bg"></div><div class="chap"><em>2</em><h1>Import your attendance</h1><div class="rule"></div></div></div>
<figcaption><div class="lab"><span>07 · CH 2</span><span>45.5–48s</span></div><p><b>Chapter card,</b> same motion as chapter 1.</p><em class="chip">cut</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-08"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>Import attendance</b></div><div class="chk"><b>✓ Matches the report</b><p>31 of 31 days read <em>✓</em></p><p>Work Hrs 231:40 · report 231:40 <em>✓</em></p><p>Overtime 52:40 · report 52:40 <em>✓</em></p></div><div class="btn hot">Fill in 31 days</div></div></div><div class="cap"><span>Or import your attendance report. The Import video shows every step.</span></div></div>
<figcaption><div class="lab"><span>08 · IMPORT</span><span>48–58s</span></div><p><b>Screenshots drop into the phone,</b> the three ticks spring, Fill in is pressed. A chip points to the Import video.</p><em class="chip">crossfade</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-09"><div class="bg"></div><div class="chap"><em>3</em><h1>History and your payslip</h1><div class="rule"></div></div></div>

<figure class="cell-wrap"><div class="cell" id="frame-10"><div class="bg"></div><div class="phone" style="top:14cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>August 2026</b><small>Every day is filled in</small></div><div class="cal"><u>S</u><u>M</u><u>T</u><u>W</u><u>T</u><u>F</u><u>S</u><i class="">1<br>11:47</i><i class="">2<br>11:57</i><i class="">3<br>12:00</i><i class="">4<br>11:33</i><i class="">5<br>9:52</i><i class="">6<br>11:47</i><i class="fr">7<br>·</i><i class="">8<br>12:00</i><i class="">9<br>11:33</i><i class="">10<br>9:52</i><i class="">11<br>11:47</i><i class="">12<br>11:57</i><i class="">13<br>12:00</i><i class="fr">14<br>·</i><i class="">15<br>9:52</i><i class="">16<br>11:47</i><i class="">17<br>11:57</i><i class="">18<br>12:00</i><i class="">19<br>11:33</i><i class="">20<br>9:52</i><i class="fr">21<br>·</i><i class="">22<br>11:57</i><i class="">23<br>12:00</i><i class="">24<br>11:33</i><i class="">25<br>9:52</i><i class="">26<br>11:47</i><i class="">27<br>11:57</i><i class="fr">28<br>·</i><i class=" ml">29<br>ML</i><i class="">30<br>9:52</i><i class="">31<br>11:47</i></div><div class="pop"><b>✓ August 2026 saved to History</b><p>Change any day later and History follows.</p><div class="two"><span>Undo</span><span class="ok">OK</span></div></div></div></div><div class="cap"><span>A finished month saves itself to History.</span></div></div>

<figure class="cell-wrap"><div class="cell" id="frame-13"><div class="bg"></div><div class="chap"><em>4</em><h1>End of Service</h1><div class="rule"></div></div></div>
