:root{--bg:#0A2620;--glass:#16382F;--ink:#ECF7F2;--soft:#C3D9CF;--acc:#10B981;--acc2:#059669;--acc3:#6EE7B7;--amb:#F59E0B;

*{box-sizing:border-box;margin:0}
body{background:#061a15;color:var(--ink);font-family:var(--ui);padding:40px 32px 80px}
header{display:flex;justify-content:space-between;align-items:end;gap:24px;max-width:1500px;margin:0 auto 28px;border-bottom:2px solid #1f4a3e;padding-bottom:18px}

.cell-wrap{margin:0}
.cell{position:relative;aspect-ratio:9/16;container-type:inline-size;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid #1f4a3e}
.bg{position:absolute;inset:0;background:radial-gradient(60cqw 60cqw at 80% 12%,#10b98138,transparent 70%),radial-gradient(70cqw 70cqw at 10% 90%,#05966922,transparent 70%)}
.bg::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
figcaption{padding:10px 2px 0} .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--acc3);letter-spacing:.02em}
figcaption p{font-size:13px;line-height:1.45;color:var(--soft);margin-top:5px} figcaption b{color:var(--ink)}
.chip{display:inline-block;margin-top:7px;font-style:normal;font-size:11px;background:#113a30;color:var(--acc3);padding:3px 9px;border-radius:99px}

.phone{position:absolute;left:50%;transform:translateX(-50%);width:55cqw;aspect-ratio:9/19;border-radius:7cqw;background:#0c1f1a;border:1.2cqw solid #22473d;box-shadow:0 3cqw 8cqw #0008;overflow:hidden}
.phone.tilt{transform:translateX(-50%) rotate(-4deg)}

.screen{position:absolute;inset:0;overflow:hidden;font-size:2.5cqw;line-height:1.3}

/* portal */

.pside{position:relative;padding:2cqw 0} .pw{padding:1.5cqw 3cqw;font-weight:700;color:#556}
.pi{padding:1.8cqw 3cqw;font-weight:700} .pi.on{background:#e7e8ee} .ps{padding:1.3cqw 3cqw 1.3cqw 5cqw;color:#667;background:#eceef3}
.hit{outline:.6cqw solid var(--amb);outline-offset:-.6cqw;color:#000;font-weight:700}
.pbody{position:relative;padding:3cqw} .ph{font-size:3.2cqw;margin-bottom:2.5cqw} .pl{font-weight:700;font-size:2.2cqw;margin-top:1.8cqw}

.pcal{display:grid;grid-template-columns:repeat(7,1fr);gap:.4cqw;margin-top:1.5cqw;background:#fff;padding:1cqw;font-size:2cqw;text-align:center}
.pcal .d{background:#2f7ac0;color:#fff;border-radius:.6cqw}
.pbtn{display:inline-block;margin-top:2.5cqw;background:#1daa55;color:#fff;padding:1.5cqw 4cqw;border-radius:.8cqw;font-weight:700}
.pt{padding:1.6cqw;font-size:2.15cqw} .tr{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;padding:1.5cqw .6cqw;border-bottom:.2cqw solid #e2e4ea}
.tr:nth-child(even){background:#eef0f4} .th{font-weight:700;background:#fff!important} .tt{font-weight:700;background:#fff!important}
.pshow{text-align:center;color:#556;margin-top:2cqw}
/* app */
.screen:not(:has(.pbar)){background:linear-gradient(170deg,#12392f,#0b2621);color:var(--ink)}
.ah{padding:7cqw 3.6cqw 2cqw;display:flex;flex-direction:column} .ah b{font-size:4cqw} .ah small{color:var(--soft)}
.res{margin:0 3cqw;border-radius:3.4cqw;background:linear-gradient(160deg,#10b981,#059669);padding:3.4cqw} .res small{font-size:1.8cqw;letter-spacing:.1em}
.res b{display:block;font-size:6cqw;margin-top:.6cqw} .res em{font-style:normal;font-size:2cqw;opacity:.9}
.sal{margin:3cqw;border-radius:3.4cqw;background:#16382fcc;border:.5cqw solid #10b98166;padding:3cqw} .sal.empty{border-color:var(--amb)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin-top:2cqw} .two small{display:block;color:var(--soft);font-size:2cqw}
.two i{display:block;font-style:normal;font-weight:700;font-size:3cqw;background:#0e2b24;border-radius:2cqw;padding:2cqw;margin-top:.8cqw}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.7cqw;padding:2cqw 3cqw;font-size:1.75cqw;text-align:center}
.cal u{text-decoration:none;color:var(--soft)} .cal i{font-style:normal;background:#16382f;border-radius:1.4cqw;padding:.8cqw 0;line-height:1.25;font-weight:700}
.cal .fr{background:#10b98140} .cal .ml{background:#0ea5e950;color:#bae6fd} .cal .sel{outline:.5cqw solid var(--acc3)}
.ed{margin:2cqw 3cqw;border:.4cqw solid #10b98166;border-radius:3cqw;padding:2.6cqw;background:#10b98114;text-align:center}
.ed small{display:block;color:var(--acc3);font-size:2cqw} .tb{display:flex;gap:1.6cqw;margin-top:2cqw;align-items:center} .tb span{width:9cqw;height:9cqw;display:grid;place-items:center;background:#0e2b24;border-radius:2cqw;font-size:4cqw}
.tb i{flex:1;font-style:normal;font-weight:700;font-size:5cqw;background:#0e2b24;border-radius:2cqw;padding:1.4cqw 0}
.sum{display:flex;justify-content:space-between;margin-top:1.8cqw;font-size:1.9cqw;color:var(--soft)} .sum b{color:var(--acc3)}
.chk{margin:4cqw 3cqw;border-radius:3cqw;background:#10b98126;padding:3.2cqw} .chk b{font-size:3.4cqw} .chk p{margin-top:1.6cqw;font-size:2.4cqw;display:flex;justify-content:space-between}
.chk em{font-style:normal;color:var(--acc3);font-weight:900}
.btn{margin:3cqw;border-radius:3cqw;background:linear-gradient(160deg,#10b981,#059669);text-align:center;padding:3.4cqw;font-weight:700;font-size:3cqw}
.btn.hot{outline:.8cqw solid var(--amb)}
.lst{margin:3cqw} .lr{background:#16382f;border-radius:2.4cqw;padding:2.4cqw;margin-bottom:1.8cqw} .lr b{display:block;font-size:2.6cqw} .lr span{color:var(--soft);font-size:2.1cqw}
.lr.warn{border:.4cqw solid #f59e0b88}
.pop{position:absolute;left:3cqw;right:3cqw;bottom:6cqw;background:#1b4439;border-radius:3.4cqw;padding:3cqw;box-shadow:0 2cqw 6cqw #0009} .pop b{font-size:3cqw} .pop p{color:var(--soft);font-size:2.1cqw;margin-top:1cqw}
.pop .two span{text-align:center;padding:1.8cqw;border-radius:2cqw;background:#0e2b24;font-weight:700} .pop .ok{background:#10b981!important}
.thumbs{position:absolute;right:2.5cqw;top:28cqw;display:grid;gap:1.4cqw;z-index:5}
.thumbs i{display:block;width:10cqw;aspect-ratio:9/19;border-radius:2cqw;background:#f3f4f7;border:.6cqw solid #fff;box-shadow:0 1cqw 3cqw #0008;font:900 3.2cqw/1 var(--disp);color:#56489a;display:grid;place-items:center}
.flash{position:absolute;inset:0;background:#fff;opacity:.35;z-index:2}
/* type cells */
.title{position:absolute;left:8cqw;right:8cqw;top:22cqw} .title h1{font:900 11cqw/1.02 var(--disp);letter-spacing:-.02em} .title h1.acc{color:var(--acc3)}
.title p{margin-top:5cqw;font:700 4.4cqw/1.35 var(--disp);color:var(--soft)}
.chap{position:absolute;left:8cqw;right:8cqw;top:38%} .chap em{font:900 30cqw/0.8 var(--disp);color:#10b98155;font-style:normal;display:block}
.chap h1{font:900 9cqw/1.05 var(--disp);margin-top:2cqw} .chap .rule{height:1.4cqw;width:30cqw;background:var(--acc);margin-top:4cqw;border-radius:9cqw}
.side{position:absolute;left:7cqw;right:7cqw;top:24cqw;font:700 3.6cqw/1.3 var(--disp)}
.meta{padding:7cqw;background:#0d2c25} .meta h2{font:900 7cqw var(--disp);margin-bottom:4cqw} .meta p{font-size:3.6cqw;margin-top:4cqw;color:var(--soft)}
.seams{display:flex;flex-wrap:wrap;gap:2cqw} .seams span{font:700 3.4cqw var(--disp);background:#16382f;border-radius:2cqw;padding:1.6cqw 2.2cqw} .seams i{display:block;font:400 2.6cqw var(--ui);color:var(--acc3)}
.sw{font-size:3.4cqw;line-height:2.1} .sw i{display:inline-block;width:5cqw;height:5cqw;border-radius:1.2cqw;vertical-align:middle;margin-right:2cqw;border:.3cqw solid #ffffff33}
.ban{color:#fcd34d!important}
</style></head><body>
<header><div><h1>Import your attendance <sup>v2</sup></h1><p>Screenshot your attendance report, upload it, and the app fills your month, checked against the report’s own totals.</p></div><em class="tag">1080×1920 · ~72s · 10 frames · English voice + captions</em></header>

<figure class="cell-wrap"><div class="cell" id="frame-06"><div class="bg"></div><div class="kicker">Step 5</div><div class="kicker">Import in the app</div><div class="phone" style="top:26cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>Import attendance</b></div><div class="btn hot">Upload screenshots</div><div class="lst"><div class="lr"><b>Reading your screenshots…</b><span>This happens on your phone. Nothing is uploaded.</span></div></div></div></div><div class="cap"><span>In the app: Import, then Upload screenshots. Nothing leaves your phone.</span></div></div>
<figcaption><div class="lab"><span>06 · UPLOAD</span><span>38–47s</span></div><p><b>The phone turns into the app:</b> tap Count it day by day, Import, Upload screenshots; five thumbnails drop in; "Reading your screenshots" fills its bar.</p><em class="chip">crossfade to the app</em></figcaption></figure>
<figure class="cell-wrap"><div class="cell" id="frame-07"><div class="bg"></div><div class="kicker">Proof</div><div class="kicker">It checks itself</div><div class="phone" style="top:26cqw"><div class="notch"></div><div class="screen"><div class="ah"><b>Import attendance</b></div><div class="chk"><b>✓ Matches the report</b><p>31 of 31 days read <em>✓</em></p><p>Work Hrs 231:40 · report 231:40 <em>✓</em></p><p>Overtime 52:40 · report 52:40 <em>✓</em></p></div></div></div><div class="cap"><span>Three ticks: every day was read right.</span></div></div>
